<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="userShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <!-- Notepad base -->
    <rect x="10" y="6" width="42" height="52" rx="4" fill="url(#padGrad)" stroke="#0284c7" stroke-width="2"/>
    <rect x="10" y="6" width="42" height="10" rx="3" fill="url(#headGrad)"/>
    <!-- Spiral rings -->
    <g fill="#e2e8f0" stroke="#475569" stroke-width="1">
      <rect x="15" y="3" width="3" height="6" rx="1"/>
      <rect x="23" y="3" width="3" height="6" rx="1"/>
      <rect x="31" y="3" width="3" height="6" rx="1"/>
      <rect x="39" y="3" width="3" height="6" rx="1"/>
    </g>
    <!-- Notepad lines -->
    <line x1="16" y1="24" x2="36" y2="24" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="31" x2="32" y2="31" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="38" x2="28" y2="38" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <!-- User badge overlay -->
    <circle cx="42" cy="43" r="15" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="42" cy="39" r="5.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
    <path d="M32 52 C33 46 51 46 52 52" fill="url(#userShirt)" stroke="#15803d" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>

