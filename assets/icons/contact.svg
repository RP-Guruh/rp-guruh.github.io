  </defs>
  <g filter="url(#drop)">
    <rect x="6" y="16" width="52" height="36" rx="4" fill="url(#envBody)" stroke="#1d4ed8" stroke-width="2"/>
    <path d="M7 50 L25 34 M57 50 L39 34" stroke="#60a5fa" stroke-width="2"/>
    <path d="M6 17 L32 37 L58 17 Z" fill="url(#envFlap)" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/>
